name: CI

on:
  push:
  pull_request:

jobs:
  fast:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -r requirements-dev.txt
      - name: Ruff
        run: python -m ruff check src tests run_project.py verify_project.py
      - name: Mypy
        run: python -m mypy src
      - name: Focused tests
        run: python -m pytest -q tests/test_quality.py tests/test_evaluation_metrics.py tests/test_data_io.py

  full:
    runs-on: ubuntu-latest
    needs: fast
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -r requirements-dev.txt
      - name: Tests with coverage
        run: python -m pytest --cov=src/bio_spread_project --cov-report=term-missing --cov-fail-under=90 -q tests

  release:
    runs-on: ubuntu-latest
    needs: full
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -r requirements-dev.txt
      - name: Release verification
        run: python verify_project.py --release

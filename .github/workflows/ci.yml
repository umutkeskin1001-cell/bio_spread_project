name: CI

on:
  push:
  pull_request:

jobs:
  fast:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e .[dev]
      - name: Ruff
        run: python -m ruff check src tests
      - name: Mypy
        run: python -m mypy src
      - name: Tests
        run: python -m pytest -v tests/

  full:
    runs-on: ubuntu-latest
    needs: fast
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e .[dev]
      - name: Ruff
        run: python -m ruff check src tests
      - name: Mypy
        run: python -m mypy src
      - name: pip-audit
        run: python -m pip_audit
      - name: Build Docker image
        run: docker build -t bio-spread .
      - name: Tests with coverage
        run: python -m pytest --cov=src/bio_spread --cov-report=term-missing --cov-fail-under=80 -v tests

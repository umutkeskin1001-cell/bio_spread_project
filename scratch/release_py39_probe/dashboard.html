<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BioSpread Competition Audit</title>
  <style>
    :root {
      --bg: #f7f8fb; --paper: #ffffff; --ink: #18202f; --muted: #617089;
      --line: #d9e0ea; --blue: #2457d6; --green: #14845f; --red: #bf2f45;
      --amber: #a96700; --shadow: 0 10px 30px rgba(30, 41, 59, 0.08);
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); font-family: system-ui, -apple-system, sans-serif; line-height: 1.45; }
    .shell { max-width: 1200px; margin: 0 auto; padding: 40px 24px; }
    header { display: flex; justify-content: space-between; align-items: start; padding: 32px; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); }
    h1 { margin: 0 0 8px; font-size: 32px; }
    p { margin: 0; color: var(--muted); }
    .status { padding: 12px 24px; border-radius: 8px; font-weight: 700; border: 1px solid; }
    .status.pass { color: var(--green); background: #ecf8f3; border-color: #b8e4d2; }
    .status.fail { color: var(--red); background: #fff5f5; border-color: #feb2b2; }
    .grid { display: grid; gap: 24px; margin-top: 24px; }
    .metrics { grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }
    .two-col { grid-template-columns: 1.2fr 0.8fr; }
    .card { background: var(--paper); border: 1px solid var(--line); border-radius: 12px; padding: 24px; box-shadow: var(--shadow); }
    .metric-label { color: var(--muted); font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; }
    .metric-value { margin-top: 8px; font-size: 32px; font-weight: 800; }
    .table { width: 100%; border-collapse: collapse; margin-top: 16px; }
    .table th { text-align: left; color: var(--muted); padding: 12px 8px; border-bottom: 2px solid var(--line); }
    .table td { padding: 12px 8px; border-bottom: 1px solid var(--line); }
    .gate-pass { color: var(--green); font-weight: 600; }
    .gate-fail { color: var(--red); font-weight: 600; }
    svg { width: 100%; height: auto; }
    @media (max-width: 900px) { .two-col { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="shell">
    <header>
      <div>
        <h1>BioSpread Competition Audit</h1>
        <p>What this predicts: geographic spread risk signals for plasmid backbones.</p>
      </div>
      <div id="main-status" class="status">LOADING...</div>
    </header>

    <div class="grid metrics" id="metric-grid"></div>

    <div class="grid two-col">
      <div class="card">
        <h3>Calibration Curve</h3>
        <div id="calibration-container"></div>
      </div>
      <div class="card">
        <h3>Quality Gate Detail</h3>
        <table class="table"><tbody id="gate-table"></tbody></table>
      </div>
    </div>

    <div class="grid two-col">
      <div class="card">
        <h3>Permutation Importance</h3>
        <div id="importance-container"></div>
      </div>
      <div class="card">
        <h3>Environment</h3>
        <table class="table" id="env-table"></table>
      </div>
    </div>
  </div>

  <script>
    const data = {"validation": {"mode": "spatial_group_cv_stacked", "roc_auc": 0.9815543033634377, "average_precision": 0.705107253486791, "prevalence": 0.05291624031574331, "expected_calibration_error": 0.007170050897461841, "brier_score": 0.02436128141701311, "n_backbones": 6841, "n_positive": 362, "bootstrap_roc_auc_ci_low": 0.9784051380993876, "bootstrap_roc_auc_ci_high": 0.9844534053534375, "bootstrap_average_precision_ci_low": 0.6591758583392302, "bootstrap_average_precision_ci_high": 0.7388332298719987, "max_single_feature_auc": 0.9453830522580816, "suspicious_feature_count": 0, "top_features": [{"feature": "geo_macro_region_entropy_train", "score": 2.180134917584137}, {"feature": "geo_country_entropy_train", "score": 1.7066083338319635}, {"feature": "log1p_n_countries_train", "score": 1.7066083338319635}, {"feature": "coherence_score", "score": 1.2879573078114885}, {"feature": "eco_clinical_context_saturation_norm", "score": 0.9957681861193499}, {"feature": "log1p_member_count_train", "score": 0.8568267853114608}, {"feature": "A_eff_norm", "score": 0.79657548127801}, {"feature": "mash_neighbor_distance_train_norm", "score": 0.7764254308759029}, {"feature": "amr_burden_saturation_norm", "score": 0.5682942421124882}, {"feature": "H_external_host_range_norm", "score": 0.5021284913655214}], "calibration_bins": [{"bin_start": 0.0, "bin_end": 0.2, "mean_prediction": 0.01028629609626614, "observed_rate": 0.008712181213369238, "count": 6313}, {"bin_start": 0.2, "bin_end": 0.4, "mean_prediction": 0.2910440377794816, "observed_rate": 0.43558282208588955, "count": 163}, {"bin_start": 0.4, "bin_end": 0.6000000000000001, "mean_prediction": 0.5007599870962, "observed_rate": 0.47107438016528924, "count": 121}, {"bin_start": 0.6000000000000001, "bin_end": 0.8, "mean_prediction": 0.7012797142822168, "observed_rate": 0.6214285714285714, "count": 140}, {"bin_start": 0.8, "bin_end": 1.0, "mean_prediction": 0.8770962437142954, "observed_rate": 0.8846153846153846, "count": 104}], "tracks": {"oof": {"status": "evaluated", "roc_auc": 0.9815543033634377, "average_precision": 0.705107253486791, "expected_calibration_error": 0.007170050897461841, "brier_score": 0.02436128141701311, "n_backbones": 6841.0, "n_positive": 362.0, "prevalence": 0.05291624031574331, "bootstrap_roc_auc_ci_low": 0.9784051380993876, "bootstrap_roc_auc_ci_high": 0.9844534053534375, "bootstrap_average_precision_ci_low": 0.6591758583392302, "bootstrap_average_precision_ci_high": 0.7388332298719987}, "group_oof": {"status": "evaluated", "roc_auc": 0.9815543033634377, "average_precision": 0.705107253486791}, "temporal_holdout": {"status": "evaluated", "roc_auc": 0.991811834669836, "average_precision": 0.6084067569284316, "n_backbones": 5628.0}, "external_holdout": {"status": "not_evaluated"}, "adversarial_leakage": {"status": "evaluated", "max_single_feature_auc": 0.9453830522580816, "suspicious_feature_count": 0.0}}}, "quality_gates": {"cross_validated": true, "auc_at_least_target": true, "average_precision_above_prevalence": true, "calibration_ece_at_most_target": true, "bootstrap_auc_ci_low_at_least_target": true, "bootstrap_average_precision_ci_low_above_prevalence": true, "group_auc_at_least_target": true, "temporal_holdout_auc_at_least_target": true, "external_holdout_auc_at_least_target": true, "leakage_audit_passed": true, "adversarial_leakage_scan_passed": true}, "all_passed": true, "primary_model": "geobio_reliability_ensemble", "input_mode": "geo_reliability_feature_surface", "environment": {"python": "3.9.6", "polars": "0.20.31", "ssl_backend": "LibreSSL 2.8.3", "numpy": "1.26.4", "scikit_learn": "1.6.1", "git_commit": "9cfd575b993e3d892e2d0b791ab21375fcdfc710"}, "input_hashes": {"geo_spread_features": "80015d8336d4183d76574c497120e0f7945f4ad356debabbb29052aa55fa9376"}};

    // 1. Header Status
    const statusEl = document.getElementById('main-status');
    statusEl.textContent = data.all_passed ? 'QUALITY PASS' : 'REVIEW REQUIRED';
    statusEl.className = 'status ' + (data.all_passed ? 'pass' : 'fail');

    // 2. Metrics
    const metrics = [
      { label: 'ROC AUC', value: data.validation.roc_auc },
      { label: 'Avg Precision', value: data.validation.average_precision },
      { label: 'Calibration ECE', value: data.validation.expected_calibration_error },
      { label: 'Prevalence', value: data.validation.prevalence },
    ];
    const grid = document.getElementById('metric-grid');
    metrics.forEach(m => {
      const card = document.createElement('div');
      card.className = 'card';
      const label = document.createElement('div');
      label.className = 'metric-label';
      label.textContent = m.label;
      const value = document.createElement('div');
      value.className = 'metric-value';
      value.textContent = Number.isFinite(m.value) ? m.value.toFixed(3) : 'not_evaluated';
      card.appendChild(label);
      card.appendChild(value);
      grid.appendChild(card);
    });

    // 3. Gates
    const gateTable = document.getElementById('gate-table');
    Object.entries(data.quality_gates).forEach(([name, pass]) => {
      const tr = document.createElement('tr');
      const tdName = document.createElement('td');
      tdName.textContent = name.replace(/_/g, ' ');
      const tdPass = document.createElement('td');
      tdPass.className = pass ? 'gate-pass' : 'gate-fail';
      tdPass.textContent = pass ? 'PASS' : 'FAIL';
      tr.appendChild(tdName);
      tr.appendChild(tdPass);
      gateTable.appendChild(tr);
    });

    // 4. Calibration SVG
    const calBins = data.validation.calibration_bins || [];
    if (calBins.length > 0) {
      const w = 600, h = 300, pad = 40;
      let svg = `<svg viewBox="0 0 ${w} ${h}">`;
      svg += `<line x1="${pad}" y1="${h-pad}" x2="${w-pad}" y2="${pad}" stroke="#cbd5e1" stroke-dasharray="4"/>`;

      const pts = calBins.map((b, i) => {
        const x = pad + (i / (calBins.length - 1)) * (w - 2 * pad);
        const y_pred = h - pad - (b.mean_prediction * (h - 2 * pad));
        const y_obs = h - pad - (b.observed_rate * (h - 2 * pad));
        return {x, y_pred, y_obs};
      });

      const line = (key, color) => {
        const d = pts.map((p, i) => (i === 0 ? 'M' : 'L') + `${p.x},${p[key]}`).join(' ');
        return `<path d="${d}" fill="none" stroke="${color}" stroke-width="3"/>`;
      };

      svg += line('y_pred', '#2457d6');
      svg += line('y_obs', '#14845f');
      svg += `</svg>`;
      document.getElementById('calibration-container').innerHTML = svg;
    }

    // 5. Importance SVG
    const imps = data.validation.top_features || [];
    if (imps.length > 0) {
      const h = imps.length * 40 + 20, w = 600, left = 200;
      const maxScore = Math.max(...imps.map(i => i.score));
      let svg = `<svg viewBox="0 0 ${w} ${h}">`;
      imps.forEach((imp, i) => {
        const y = i * 40 + 20;
        const barW = (imp.score / maxScore) * (w - left - 60);
        svg += `<text x="10" y="${y+15}" font-size="12" fill="var(--ink)">${imp.feature}</text>`;
        svg += `<rect x="${left}" y="${y}" width="${barW}" height="20" fill="var(--blue)" rx="4"/>`;
        svg += `<text x="${left + barW + 10}" y="${y+15}" font-size="12" fill="var(--muted)">${imp.score.toFixed(3)}</text>`;
      });
      svg += `</svg>`;
      document.getElementById('importance-container').innerHTML = svg;
    }

    // 6. Env Table
    const envTable = document.getElementById('env-table');
    Object.entries(data.environment).forEach(([k, v]) => {
      const tr = document.createElement('tr');
      const tdK = document.createElement('td');
      const tdV = document.createElement('td');
      tdK.textContent = String(k);
      tdV.textContent = String(v);
      tr.appendChild(tdK);
      tr.appendChild(tdV);
      envTable.appendChild(tr);
    });
  </script>
</body>
</html>

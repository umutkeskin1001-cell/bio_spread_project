data:
  fasta_path: data/project_inputs/raw/plsdb_sequences.fasta
  backbones_tsv: data/project_inputs/silver/plasmid_backbones.tsv
  amr_tsv: data/project_inputs/silver/plasmid_amr_consensus.tsv
  out_dir: data/dna_sentinel
  limit: 2048
  min_len: 1000
  max_len: 300000
  seed: 42
  expansion_country_threshold: 15

model:
  n_canonical_features: 2728
  n_structural_features: 19
  hidden_dim: 128
  frp_out_dim: 320
  n_layers: 3
  lora_rank: 12
  adapter_rank: 12
  n_evidence_heads: 1
  drop_path_rate: 0.12
  aux_loss_weight: 0.25
  dropout: 0.12
  max_windows: 28
  expansion_classes: 1
  amr_classes: 1
  label_smoothing: 0.08
  use_scale_embedding: false
  use_cppe: true
  use_window_conv: true
  window_conv_kernel: 5
  glu_expansion: 2

features:
  window_sizes: [512, 2048, 8192]
  strides: [256, 1024, 4096]
  max_windows: [16, 8, 4]

training:
  epochs: 120
  batch_size: 32
  lr: 0.0003
  backbone_lr: 0.00025
  head_lr: 0.00035
  min_lr: 0.00001
  warmup_epochs: 6
  weight_decay: 0.05
  patience: 30
  gradient_accumulation_steps: 2
  focal_loss_gamma: 2.0
  mixup_alpha: 0.0
  dropout: 0.12
  balanced_sampling: true
  score_mode: equal
  artifact_dir: artifacts/cassiopeia_prime

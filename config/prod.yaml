data:
  backbones_path: "data/project_inputs/silver/plasmid_backbones.tsv"
  split_year: 2020
  val_backbone_frac: 0.15
  test_backbone_frac: 0.15
  spread_horizon: 3
  require_country_history: true
  feature_dir: "data/features"

model:
  static_dim: 128
  temporal_dim: 128
  gru_hidden: 192
  gru_layers: 2
  dropout: 0.15
  max_seq_len: 45
  n_hazard_steps: 3
  taxonomy_embed_dim: 8
  categorical_embed_dim: 16
  use_cross_attention: false   # Simplified for prod
  use_enhanced_cold_start: true

  # Flag to enable legacy research components (set false for prod)
  use_research: false

  use_mamba: false
  use_hyperbolic: true         # Only for taxonomy as per plan
  use_evidential: true         # Essential for uncertainty
  use_cagrad: false            # Replaced by uncertainty-weighted loss
  use_retrieval: false         # Removed in Phase 1 new design

  # Hyperbolic taxonomy (Poincare only for taxonomy)
  tax_dim_per_level: 16
  hyperbolic_curvature: -1.0

  # EDL hyperparams
  edl_lambda_kl: 0.1
  edl_target_smoothing: 0.05

training:
  batch_size: 64
  lr: 0.0003
  weight_decay: 0.01
  epochs: 10                  # Faster convergence target
  patience: 8
  warmup_epochs: 3
  grad_clip: 1.0
  
  # New simplified loss weights (will be balanced by uncertainty weighting)
  lambda_proxy: 1.0
  lambda_contrast: 0.5
  lambda_kd: 0.5
  
  temporal_masking_prob: 0.3
  gaussian_noise_std: 0.05
  calibrate: true
  use_adaptive_loss: true      # Uses the new Uncertainty-Weighted Multi-Task
  use_curriculum: true
  seed: 42

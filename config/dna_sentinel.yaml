data:
  fasta_path: data/project_inputs/raw/plsdb_sequences.fasta
  backbones_tsv: data/project_inputs/silver/plasmid_backbones.tsv
  amr_tsv: data/project_inputs/silver/plasmid_amr_consensus.tsv
  out_dir: data/dna_sentinel
  limit: 2048
  min_len: 1000
  max_len: 300000
  seed: 42
  expansion_country_threshold: 15

model:
  n_canonical_features: 2728
  n_structural_features: 19
  hidden_dim: 128
  frp_out_dim: 256
  n_layers: 2
  lora_rank: 8
  n_evidence_heads: 1
  drop_path_rate: 0.1
  aux_loss_weight: 0.3
  dropout: 0.15

features:
  window_sizes: [512, 2048, 8192]
  strides: [256, 1024, 4096]
  max_windows: [16, 8, 4]

training:
  epochs: 100
  batch_size: 32
  lr: 0.0003
  min_lr: 0.00001
  warmup_epochs: 5
  weight_decay: 0.05
  patience: 25
  gradient_accumulation_steps: 2
  focal_loss_gamma: 2.0
  mixup_alpha: 0.3
  artifact_dir: artifacts/dna_sentinel

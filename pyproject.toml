[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-v --tb=short -x"
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["N806", "N812"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true

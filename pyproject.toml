[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bio-spread-reborn"
version = "0.1.0"
description = "Modular time-aware evidential learning pipeline for plasmid spread"
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.26,<3",
  "scikit-learn>=1.4,<2",
  "polars>=0.20,<1",
  "numba>=0.59,<1",
  "joblib>=1.3,<2",
  "torch>=2.0,<3",
  "torch_geometric>=2.0,<3",
  "scipy>=1.11,<2",
  "PyYAML>=6.0",
  "click>=8.0",
  "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0.3,<10",
  "pytest-cov>=5,<8",
  "hypothesis>=6,<7",
  "ruff>=0.6,<1",
  "mypy>=1.11,<2",
  "pip-audit>=2.7,<3",
  "types-PyYAML",
]

[project.scripts]
bio-spread = "bio_spread_reborn.cli.main:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "--ignore=test_output.txt --ignore=test_bio_spread_output.txt --ignore=test_bio_spread_all_output.txt"
filterwarnings = [
  "ignore:.*oneOf.*deprecated.*:DeprecationWarning",
  "ignore:.*parseString.*deprecated.*:DeprecationWarning",
  "ignore:.*resetCache.*deprecated.*:DeprecationWarning",
  "ignore:.*enablePackrat.*deprecated.*:DeprecationWarning",
]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501", "E402"]

[tool.mypy]
python_version = "3.9"
strict = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true
no_implicit_optional = true
follow_imports = "skip"
disable_error_code = ["import-untyped"]

[[tool.mypy.overrides]]
module = ["sklearn", "sklearn.*", "joblib", "scipy", "scipy.*"]
ignore_missing_imports = true

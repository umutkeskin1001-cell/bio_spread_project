[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "dna-sentinel"
version = "0.3.0"
description = "DNA-only mobile genetic element risk modeling"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.24",
    "scikit-learn>=1.2",
    "click>=8.0",
    "pyyaml>=6.0",
    "polars>=0.18",
    "mmh3>=3.0",
]

[project.scripts]
dna-sentinel = "dna_sentinel.cli:cli"
dna = "dna_sentinel.cli:dna"

[project.optional-dependencies]
api = [
    "fastapi>=0.100",
    "uvicorn>=0.22",
    "pydantic>=2.0",
]
dev = [
    "pytest>=8,<10",
    "pytest-cov>=4,<6",
    "ruff>=0.6,<1",
    "mypy>=1.11,<2",
]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-v --tb=short -x --cov=src --cov-report=term --cov-report=html --cov-fail-under=85"
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.coverage.run]
source = ["src"]
omit = ["tests/*", "src/dna_sentinel.egg-info/*", "*/__pycache__/*"]

[tool.coverage.paths]
source = ["src", ".tox/*/site-packages"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "if __name__ == .__main__.:"]

[tool.ruff]
line-length = 128
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["N806", "N812"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
